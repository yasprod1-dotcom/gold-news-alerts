name: Gold news alerts

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gold-news-scheduled-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read program files
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Restore news history
        uses: actions/cache/restore@v5
        with:
          path: .cloud-state
          key: gold-news-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: gold-news-v1-
      - name: Check official sources
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOLD_STATE_DIR: .cloud-state
          PYTHONUNBUFFERED: '1'
        run: python3 cloud.py
      - name: Save news history
        if: always() && !cancelled()
        uses: actions/cache/save@v5
        with:
          path: .cloud-state
          key: gold-news-v1-${{ github.run_id }}-${{ github.run_attempt }}
